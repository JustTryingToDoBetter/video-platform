
services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: video-platform-api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/api/app:/app/app
    depends_on:
      - postgres
      - redis
    
  
  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: video-platform-worker
    env_file:
      - .env.example
    volumes:
      - ./services/api/app:/app/app
    depends_on:
      - redis
  

  postgres:
    image: postgres:16
    container_name: video-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: video-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: